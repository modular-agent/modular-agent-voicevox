[package]
name = "modular-agent-voicevox"
version = "0.7.0"
description = "VoiceVox TTS Agents for Modular Agent"
authors = ["Akira Ishino <akira@lumilab.jp>"]
edition = "2024"
license = "Apache-2.0 OR MIT"

[dependencies]
base64 = "0.22.1"
modular-agent-core = { path = "../../crates/modular-agent-core" }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["rustls"]
default-tls = ["reqwest/default-tls"]
rustls = ["reqwest/rustls"]
